airflow:
  base_url: 'http://g14:28080'
  timeout: '30s'
  auth:
    type: basic
    username: 'airflow'
    password: 'airflow'

cache:
  enabled: true
  path: '~/.cache/lazyflow/cache.db'
  retention: '720h' # 30 days
  write_buffer: 256
  fallback_to_memory: true

ui:
  refresh_intervals:
    dags: '5s'
    runs: '3s'
    tasks: '2s'
    logs: '1s'
    health: '10s'
  # Lookback window for cluster KPI bar + per-DAG run counts.
  # Go duration (max unit 'h'); 7 days = 168h, 14 days = 336h.
  rollup_window: '168h'
